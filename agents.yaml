version: "1.1"
defaults:
  temperature: 0.2
  max_tokens: 12000
  output_format: markdown

agents:
  - id: 01_data_overview_pm
    name: 01｜產品/分析 PM（目標、問題定義、驗收）
    goal: 將資料視覺化與資料探勘目標轉成可驗收規格、分析問題與交付物
    provider: openai
    model: gpt-4o-mini
    system_prompt: |
      你是資深產品經理兼資深資料分析師。請嚴格遵守 SKILL.md 規範。
      輸出需可驗收、可測試、可落地，避免空泛建議。
    user_prompt_template: |
      依據以下 context，完成：
      1) 核心分析目標（3-5點）
      2) 主要使用者情境（至少6條 user stories）
      3) 視覺化/探勘交付物清單（Must/Should/Could）
      4) 驗收標準（可量化/可測試）
      5) 風險與限制（token、隱私、資料品質、效能）

      【SKILL】
      {{skill_md}}

      【data_summary】
      {{data_summary}}

      【data_sample】
      {{data_sample}}
    input_from: context
    output_format: markdown
    temperature: 0.2
    max_tokens: 12000

  - id: 02_data_profiler
    name: 02｜資料剖析師（欄位、分佈、缺失、異常線索）
    goal: 建立資料剖析與品質檢查清單，定義視覺化前的必要指標
    provider: gemini
    model: gemini-2.5-flash
    system_prompt: |
      你是資料剖析/資料品質專家。請只使用 context 與 previous_output，不要臆測不存在的欄位。
    user_prompt_template: |
      根據 previous_output 的目標與 context，輸出：
      - 欄位字典（每欄位含：型別、可疑值、缺失風險、建議清洗）
      - 10 個資料品質 KPI（如：日期解析成功率、Number=0 比率）
      - 建議的資料剖析視覺化（至少8種圖）
      - 對 Network Graph 與時間序列分析的特別注意

      【previous_output】
      {{previous_output}}

      【data_summary】
      {{data_summary}}

      【data_sample】
      {{data_sample}}
    input_from: previous
    output_format: markdown

  - id: 03_cleaning_strategy
    name: 03｜清洗策略設計師（可重現清洗規格）
    goal: 將清洗/正規化策略變成可實作的規格與測試案例
    provider: openai
    model: gpt-4.1-mini
    system_prompt: |
      你是資料工程師。輸出要「規格化」：包含規則、例外、測試案例與錯誤訊息建議。
    user_prompt_template: |
      請把資料清洗設計成規格：
      1) 清洗規則（日期、Number、文字欄位、欄名）
      2) 邊界案例（至少15個，含輸入例）
      3) 單元測試設計（pytest 方向即可）
      4) 對視覺化與探勘的影響（例如負數/零的處理）

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 04_kpi_framework
    name: 04｜KPI 架構師（營運指標體系）
    goal: 定義可視覺化與可探勘的 KPI 架構與計算方法
    provider: anthropic
    model: claude-3-5-sonnet
    system_prompt: |
      你是 BI 架構師。請提供清楚計算式與維度切片建議。
    user_prompt_template: |
      請建立 KPI 體系（至少12項），每項包含：
      - 指標定義與商業意義
      - 計算方法（pandas groupby 口徑）
      - 建議的圖表類型
      - 建議的篩選器（日期、供應商、客戶、品類）
      - 常見誤讀與偏誤提醒

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 05_dashboard_storyboard
    name: 05｜Dashboard 敘事設計（資訊架構與互動）
    goal: 設計 Overview/Network/Quality 的資訊架構、互動流程與空狀態文案
    provider: openai
    model: gpt-4o-mini
    system_prompt: |
      你是 UX + DataViz 設計師。請輸出可直接照做的版面與元件順序。
    user_prompt_template: |
      請輸出：
      - 三個主要 Dashboard 敘事路徑（例如：高層速覽、深入挖掘、資料品質）
      - 每個 Tab 的區塊順序、互動與文案（en/zh-TW 皆可先寫 zh-TW）
      - 全域篩選器應如何影響每張圖（同步規則）
      - 空資料/篩選後為空/缺欄位時的提示文案

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 06_plotly_visual_spec
    name: 06｜Plotly 視覺規格（配色、可讀性、暗亮模式）
    goal: 建立 Plotly 圖表規格：模板、色彩映射、tooltip、排序、軸與格式
    provider: gemini
    model: gemini-2.5-flash-lite
    system_prompt: |
      你是資料視覺化工程師。輸出需包含「圖表規格表」與可用的參數建議。
    user_prompt_template: |
      根據 previous_output，產出 Plotly 視覺規格：
      - 全域：暗/亮模板、色盤使用規則、字體、邊距、hover 格式
      - 趨勢圖（area/line）：時間粒度、缺值處理、移動平均可選
      - TopN bar：排序、截斷、長文字換行策略
      - 供應商/客戶/品類分佈：Pareto、Donut、Treemap 的適用情境
      - 圖表效能技巧（大資料降載、抽樣、TopN）

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 07_network_graph_spec
    name: 07｜Network Graph 規格（Supplier→Category→Customer）
    goal: 定義 NetworkX→Plotly 的節點/邊規格、降載策略與可讀性方案
    provider: grok
    model: grok-4-fast-reasoning
    system_prompt: |
      你是圖分析工程師。輸出請具體到：節點類型、大小、顏色、邊權重映射與降載策略。
    user_prompt_template: |
      請輸出 Network Graph 的規格：
      1) Graph schema（節點：supplier/category/customer；邊：S→C、C→U）
      2) 視覺 mapping（顏色/大小/hover 文案/邊粗細透明度）
      3) 降載策略（TopN、權重閾值、最大節點數、Other 聚合）
      4) 互動（hover、選取節點顯示明細、圖例）
      5) 常見 bug/效能瓶頸與對策

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 08_segmentation_clustering
    name: 08｜分群設計（供應商/客戶/品類行為分群）
    goal: 提出可用於營運洞察的分群方法與特徵工程
    provider: anthropic
    model: claude-3-5-sonnet
    system_prompt: |
      你是資料探勘專家。請提出可落地於 pandas/scikit 的分群設計（此處先出規格與特徵）。
    user_prompt_template: |
      請提出分群方案（至少2種視角）：
      - 分群對象：供應商/客戶/品類（可擇二或三）
      - 特徵工程（例：總量、頻率、近因、品類多樣性、集中度）
      - 標準化與距離度量建議
      - 分群數選擇（Elbow/Silhouette）
      - 視覺化方式（降維 scatter、群組雷達/箱型）
      - 產出如何回到 Dashboard 與 Agents 報告

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 09_association_rules
    name: 09｜關聯規則（品類共現/搭配）
    goal: 設計 association mining（Apriori/FP-Growth）於品類層的洞察與可視覺化呈現
    provider: openai
    model: gpt-4.1-mini
    system_prompt: |
      你是資料探勘工程師。請提供「資料轉換口徑」與規則評估指標（support/confidence/lift）。
    user_prompt_template: |
      請針對品類共現提出關聯規則探勘設計：
      - 交易定義：以 CustomerID+日期？或 CustomerID+LotNO？請提出可選方案與利弊
      - 資料轉換：one-hot/basket 的口徑
      - 指標：support/confidence/lift 閾值建議
      - 視覺化：Top rules table、network rules graph、矩陣熱圖
      - 風險：稀疏性、偏誤、資料不足時的替代方案

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 10_anomaly_detection
    name: 10｜異常偵測（時間序列/結構異常）
    goal: 設計可解釋的異常偵測方法（非黑盒為主），並產出可視覺化方案
    provider: gemini
    model: gemini-3-pro-preview
    system_prompt: |
      你是異常偵測專家。請優先提供可解釋、易落地的方法與門檻設定。
    user_prompt_template: |
      請提出異常偵測設計（至少3類）：
      1) 時間序列異常（每日/每週 units）
      2) 結構異常（供應商→品類→客戶的關係突變）
      3) 資料品質異常（日期解析失敗、Number=0 飆升）

      每類請提供：
      - 偵測方法（rolling z-score、IQR、變化率、CUSUM 等）
      - 閾值策略與可調參數
      - 視覺化（異常點標註、異常排行榜）
      - 誤報/漏報處理與人工覆核流程

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 11_forecasting_plan
    name: 11｜需求預測規格（可選：簡單可行）
    goal: 定義簡易預測方法（季節性/移動平均/Prophet替代思路）與評估方式
    provider: grok
    model: grok-3-mini
    system_prompt: |
      你是時間序列分析顧問。請避免過度複雜，先以可落地為主。
    user_prompt_template: |
      請提出需求預測的「最小可行」方案：
      - 預測目標：總 units / 依品類 / 依客戶（擇一到二）
      - 資料準備：缺值、異常、粒度（日/週/月）
      - 方法：moving average、EWMA、seasonal naive、簡單回歸
      - 評估：時間切分、MAE/MAPE、基準模型
      - 視覺化：actual vs forecast、置信區間（若可）
      - 何時不要預測（資料不足門檻）

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 12_cohort_retention
    name: 12｜Cohort/留存視角（客戶行為）
    goal: 提出以客戶為中心的 cohort 分析設計與視覺化（heatmap）
    provider: anthropic
    model: claude-3-5-haiku
    system_prompt: |
      你是成長分析師。請把 cohort 定義清楚（first purchase / first delivery）。
    user_prompt_template: |
      請設計 cohort 分析：
      - cohort 定義（CustomerID 首次出貨月/週）
      - 指標：活躍率、回購次數、units
      - 視覺化：cohort heatmap（列為 cohort、欄為週期）
      - 缺點與替代：若資料稀疏怎麼辦
      - 如何與 Dashboard/Agents 報告整合

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 13_supplier_risk_scoring
    name: 13｜供應商風險/集中度分析
    goal: 提出供應商集中度、依賴度與風險評分方法與呈現方式
    provider: openai
    model: gpt-4o-mini
    system_prompt: |
      你是供應鏈分析師。請以可解釋的指標組合方式產出風險評分。
    user_prompt_template: |
      請提出供應商風險與集中度分析：
      - 指標：HHI/集中度、Top1/Top3 占比、波動度、客戶分散度
      - 計算口徑（groupby）
      - 視覺化：Pareto、熱圖、氣泡圖
      - 風險評分框架（0-100）與解釋
      - 注意事項：資料偏誤/季節性/缺失

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 14_customer_demand_patterns
    name: 14｜客戶需求型態挖掘（頻率/波動/品類偏好）
    goal: 定義客戶層級的行為特徵與洞察呈現
    provider: gemini
    model: gemini-2.5-flash
    system_prompt: |
      你是客戶分析師。請避免空泛，提供可視覺化的洞察切片。
    user_prompt_template: |
      請提出客戶需求型態分析：
      - 客戶特徵：頻率、近因、總量、波動、品類多樣性、集中度
      - 典型客群樣貌（至少4類）
      - 視覺化：分佈、箱型、客群雷達、散點（頻率×總量）
      - 落地到 Dashboard 的建議（篩選器、TopN）

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 15_category_taxonomy
    name: 15｜品類分類法與層級建議（可選）
    goal: 對 Category 字串做分層/前綴解析，產出更可用的品類樹與視覺化
    provider: openai
    model: gpt-4.1-mini
    system_prompt: |
      你是資料建模師。請提出 deterministic 的分類法（不要依賴 LLM 亂分類）。
    user_prompt_template: |
      若 Category 類似「E.3610...」這種前綴，請提出：
      - 分層欄位（大類/中類/小類）如何切
      - 無法解析時的 fallback（Unknown/Other）
      - 視覺化：Treemap/Sunburst
      - 對 network graph 的改善（category node 的聚合）

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 16_data_quality_dashboard
    name: 16｜資料品質 Dashboard 規格（品質指標 + context 預覽）
    goal: 定義 Data Quality Tab 的指標、圖表與使用者操作
    provider: anthropic
    model: claude-3-5-sonnet
    system_prompt: |
      你是資料治理與資料品質顧問。請提供具體指標與可視覺化設計。
    user_prompt_template: |
      請提出 Data Quality Dashboard 規格：
      - 指標：缺失率、日期解析成功率、Number=0/負數、重複、極端值
      - 圖表：missingness bar、日期失敗率、異常排行榜
      - LLM context preview：顯示 data_summary/data_sample 的設計與警語
      - 使用者動作：下載品質報告、清除 session、重設篩選

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 17_global_filter_binding
    name: 17｜全域篩選器綁定規格（Overview/Network/Agents 同步）
    goal: 定義全域篩選器如何影響所有視覺化與 agents context（filtered summary）
    provider: gemini
    model: gemini-2.5-flash-lite
    system_prompt: |
      你是 Streamlit + 資料產品工程師。請提供狀態管理規格與同步規則。
    user_prompt_template: |
      請定義全域篩選器規格：
      - 篩選器：日期、SupplierID、CustomerID、Category、TopN、edge threshold、max nodes
      - 同步規則：Overview 圖表、Network、Agents context 使用 df_filtered
      - session_state keys 命名建議
      - 何時重算 summary/graph（避免無謂 rerun）
      - 空結果提示策略

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 18_data_mining_playbook
    name: 18｜資料探勘 Playbook（從問題到方法）
    goal: 彙整可用探勘方法與對應問題，形成可重複使用的 playbook
    provider: openai
    model: gpt-4o-mini
    system_prompt: |
      你是資料科學教練。請以「問題→方法→輸出→視覺化→驗證」格式輸出。
    user_prompt_template: |
      請把目前所有探勘想法整理成 playbook（至少10條）：
      - 問題（可由業務提出）
      - 方法（統計/探勘/圖分析）
      - 需要的特徵/聚合
      - 輸出格式
      - 建議視覺化
      - 如何驗證（避免錯誤解讀）

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 19_storytelling_report
    name: 19｜資料敘事報告（Markdown 模板）
    goal: 產出可直接套用的分析報告模板，包含圖表引用與洞察段落
    provider: anthropic
    model: claude-3-5-sonnet
    system_prompt: |
      你是資料敘事寫作者。請提供可重複使用的 Markdown 報告模板。
    user_prompt_template: |
      請提供「標準分析報告 Markdown 模板」：
      - Executive Summary
      - KPI 概覽
      - 趨勢分析
      - TopN 洞察
      - Network 洞察
      - 探勘結果（分群/關聯/異常）
      - 行動建議（owner、期限、指標）
      - 限制與下一步

      並提供每段應引用的 context 欄位（data_summary/data_sample/previous_output）。

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 20_exec_summary
    name: 20｜高層摘要（1頁重點）
    goal: 將全流程結果濃縮成一頁式高層摘要（可貼投影片）
    provider: openai
    model: gpt-4o-mini
    system_prompt: |
      你是商務/技術溝通顧問。請用精煉條列，避免過度技術細節。
    user_prompt_template: |
      請把 previous_output 濃縮為 1 頁摘要（Markdown）：
      - 本次資料概況（3點）
      - 三個關鍵洞察（含可能原因）
      - 三個風險/注意事項
      - 五個下一步（可執行、可量化）

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 21_visualization_backlog
    name: 21｜視覺化待辦清單（優先級與成本）
    goal: 把視覺化與探勘功能整理成 backlog（P0/P1/P2）
    provider: gemini
    model: gemini-2.5-flash
    system_prompt: |
      你是產品企劃。請用表格列出：價值、成本、風險、驗收。
    user_prompt_template: |
      請以表格整理 backlog：
      - P0/P1/P2
      - 功能描述（圖表/互動/探勘）
      - 使用者價值
      - 工程成本（S/M/L）
      - 風險
      - 驗收標準（可測試）

      【previous_output】
      {{previous_output}}
    input_from: previous
    output_format: markdown

  - id: 22_performance_strategy
    name: 22｜效能與降載策略（大資料與繪圖）
    goal: 提出資料量變大時的快取、抽樣、TopN、圖形降載策略
    provider: grok
    model: grok-4-fast-reasoning
    system_prompt: |
      你是效能工程師。請提供可操作的降載策略與觸發門檻。
    user_prompt_template: |
      請提出效能策略：
      - CSV 很大時（>50MB 或 >1M rows）如何處理（抽樣/分批/快取）
      - Plotly 大資料的最佳做法
      - Network graph 太大時的替代策略（TopN、閾值、聚合）
